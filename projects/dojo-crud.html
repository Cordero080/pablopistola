<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-ZL1CZZKRKD"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZL1CZZKRKD");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo Crud | Pablo Cordero</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="../Css/style.css" />
    <link rel="stylesheet" href="../Css/project.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/sineWave.js" defer></script>
    <!-- Vercel Analytics (only loads on Vercel) -->
    <script>
      if (
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = "/_vercel/insights/script.js";
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <canvas id="waves"></canvas>

    <!-- Side Navigation -->
    <nav class="side-nav">
      <a href="/home" class="side-nav-logo">
        <span class="logo-text">PC</span>
      </a>
      <div class="side-nav-links">
        <a href="/home" class="side-nav-link"
          ><span class="link-text">HOME</span></a
        >
        <a href="/home#projects" class="side-nav-link"
          ><span class="link-text">PROJECTS</span></a
        >
        <a href="/about" class="side-nav-link"
          ><span class="link-text">ABOUT</span></a
        >
        <a href="/home#contact" class="side-nav-link"
          ><span class="link-text">CONTACT</span></a
        >
        <a href="/resume" class="side-nav-link"
          ><span class="link-text">RESUME</span></a
        >
      </div>
    </nav>

    <main class="project-page">
      <!-- Hero Section -->
      <section class="project-hero">
        <div class="project-hero-content">
          <a href="/home" class="back-link">← Back to Projects</a>
          <h1 class="project-title">DOJO CRUD</h1>
          <p class="project-tagline">Coming Soon</p>
        </div>
      </section>

      <!-- Screenshot Gallery -->
      <section class="project-gallery">
        <div class="gallery-main">
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/main.png"
            alt="Dojo CRUD Main"
            class="gallery-hero-img"
            loading="eager"
          />
        </div>
        <div class="gallery-thumbs">
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/main.png"
            alt="Main"
            class="thumb active"
            data-full="../public/images/projects/nexus-geom-lab/dojo/main.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/sign-up.png"
            alt="Sign Up"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/sign-up.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/login.png"
            alt="Login"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/login.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/form.png"
            alt="Form"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/form.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/description.png"
            alt="Description"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/description.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/index.png"
            alt="Index"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/index.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/show.png"
            alt="Show"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/show.png"
            loading="lazy"
          />
          <img
            src="../public/images/projects/nexus-geom-lab/dojo/trash.png"
            alt="Trash"
            class="thumb"
            data-full="../public/images/projects/nexus-geom-lab/dojo/trash.png"
            loading="lazy"
          />
        </div>
      </section>

      <!-- About Section -->
      <section class="project-about">
        <div class="about-grid">
          <div class="about-description">
            <h2>About the Project</h2>
            <p>Details coming soon.</p>
          </div>

          <div class="about-details">
            <div class="detail-card">
              <h3>Project Type</h3>
              <p>CRUD Application</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Gallery Script -->
    <script>
      document.querySelectorAll(".gallery-thumbs .thumb").forEach((thumb) => {
        thumb.addEventListener("click", () => {
          document.querySelector(".gallery-hero-img").src = thumb.dataset.full;
          document
            .querySelectorAll(".thumb")
            .forEach((t) => t.classList.remove("active"));
          thumb.classList.add("active");
        });
      });
    </script>

    <script>
      // Initialize sine wave background
      document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("waves");
        if (canvas && typeof SineWave !== "undefined") {
          new SineWave(canvas, {
            speed: 0.008,
            amplitude: 40,
            wavelength: 0.015,
            strokeStyle: "rgba(0, 255, 247, 0.08)",
          });
        }
      });
    </script>
    <script src="../app.js" defer></script>
    <script src="../js/orb.js" defer></script>
  </body>
</html>
