<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xenotchi — Lab Demo | Pablo Cordero</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- Three.js r178 via import map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.178.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.178.0/examples/jsm/"
        }
      }
    </script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Audiowide&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Audiowide", "Doto", sans-serif;
        background:
          linear-gradient(rgba(62, 23, 255, 0.827), rgba(4, 2, 14, 0.65)),
          radial-gradient(
            ellipse at 90% 50%,
            rgba(0, 180, 220, 0.494) 0%,
            rgba(81, 0, 180, 0.818) 20%,
            rgba(180, 0, 141, 0.823) 40%,
            rgba(139, 31, 31, 0.55) 60%,
            rgba(68, 23, 156, 0.9) 80%,
            #322879 100%
          );
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        padding-bottom: 3rem;
      }

      /* ── Back link ── */
      .back-link {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 9999;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(0, 255, 247, 0.65);
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid rgba(0, 255, 247, 0.2);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .back-link:hover {
        color: #00fff7;
        border-color: rgba(0, 255, 247, 0.5);
      }

      /* ── Stage tabs ── */
      .stage-tabs {
        display: flex;
        margin-top: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        overflow: hidden;
        z-index: 2;
      }

      .stage-tab {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 10px 28px;
        border: none;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .stage-tab[data-stage="blue"].active {
        background: rgba(0, 140, 255, 0.2);
        color: rgb(100, 200, 255);
        box-shadow: inset 0 -2px 0 rgb(0, 140, 255);
      }
      .stage-tab[data-stage="green"].active {
        background: rgba(0, 220, 100, 0.2);
        color: rgb(80, 220, 130);
        box-shadow: inset 0 -2px 0 rgb(0, 220, 100);
      }
      .stage-tab:not(.active):hover {
        color: rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.05);
      }

      /* ── Header ── */
      header.xeno-header {
        text-align: center;
        padding: 10px 0 4px;
        margin-top: 60px;
        z-index: 2;
      }
      header.xeno-header h1 {
        font-family: "Doto", "Audiowide", sans-serif;
        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: 12px;
        color: oklch(87.87% 0.211 149.57 / 0.923);
        text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        animation: floatUpDown 5s ease-in-out infinite;
      }
      @keyframes floatUpDown {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      /* ── Layout ── */
      .scaling-root {
        width: 100%;
        max-width: 1000px;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        z-index: 2;
      }

      /* ── Pet container — canvas mounts here ── */
      #pet-container {
        position: relative;
        width: 100%;
        height: 600px;
        border-radius: 5px;
        overflow: hidden;
        margin: 8px 0 0;
        box-shadow: 0 0 25px rgba(0, 180, 255, 0.15);
        border: 3px solid oklch(70.1% 0.322 328.36 / 0.3);
        background:
          url("/images/xenotchi-bg.jpg") center / cover no-repeat,
          #000;
      }
      #pet-container canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
        z-index: 2;
      }
      /* Corner glow overlays */
      #pet-container::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 6% 80%,
          rgba(0, 200, 255, 0.28) 0%,
          transparent 38%
        );
        animation: flickerCyan 23s linear infinite;
      }
      #pet-container::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 94% 82%,
            rgba(0, 180, 220, 0.24) 0%,
            transparent 32%
          ),
          radial-gradient(
            ellipse at 90% 30%,
            rgba(200, 0, 180, 0.2) 0%,
            transparent 30%
          );
        animation: flickerRight 17s linear infinite;
      }
      @keyframes flickerCyan {
        0%,
        68%,
        100% {
          opacity: 0.5;
        }
        70% {
          opacity: 1;
        }
        71% {
          opacity: 0.15;
        }
        72% {
          opacity: 0.85;
        }
        73% {
          opacity: 0.3;
        }
        74% {
          opacity: 0.7;
        }
      }
      @keyframes flickerRight {
        0%,
        52%,
        100% {
          opacity: 0.5;
        }
        54% {
          opacity: 1;
        }
        55% {
          opacity: 0.1;
        }
        56% {
          opacity: 0.9;
        }
        57% {
          opacity: 0.2;
        }
        58% {
          opacity: 0.75;
        }
      }

      /* ── Loading spinner ── */
      #scene-loading {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        gap: 12px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        color: rgba(0, 255, 247, 0.7);
        text-transform: uppercase;
        transition: opacity 0.4s ease;
      }
      #scene-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-ring {
        width: 36px;
        height: 36px;
        border: 2px solid rgba(0, 255, 247, 0.15);
        border-top-color: rgba(0, 255, 247, 0.8);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Info box ── */
      .infoBox {
        display: flex;
        flex-direction: row;
        border: 3px solid oklch(70.1% 0.322 328.36 / 0.3);
        border-radius: 5px;
        min-height: 80px;
        overflow: hidden;
        margin-top: 6px;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.4),
          0 8px 28px rgba(0, 0, 0, 0.25);
      }
      .infoBox-controls {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: flex-start;
        padding: 10px 20px;
        gap: 10px;
        width: 45%;
        background: oklch(10% 0.05 280 / 0.15);
        backdrop-filter: blur(2px);
        border-radius: 5px;
      }
      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .Buttons {
        font-family: "Audiowide", sans-serif;
        color: #fff;
        background-color: rgba(0, 0, 200, 0.7);
        display: inline-flex;
        justify-content: center;
        align-items: center;
        letter-spacing: 4px;
        width: 88px;
        height: 40px;
        border-radius: 5px;
        font-size: 0.5em;
        font-weight: bold;
        padding: 0;
        margin: 0 1px;
        border: none;
        cursor: pointer;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        transition:
          box-shadow 0.2s ease,
          transform 0.1s ease;
      }
      .Buttons:hover {
        transform: perspective(200px) rotateX(1deg) rotateY(1deg) scale(1);
        box-shadow: 0 12px 12px rgba(0, 200, 255, 0.3);
        z-index: 2;
      }
      .Buttons:active {
        transform: scale(0.96);
      }
      .Buttons:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .feed-btn:hover {
        box-shadow: 0 12px 12px oklch(84.201% 0.2819 142.495 / 0.843);
      }
      .dance-btn:hover {
        box-shadow: 0 12px 12px oklch(71.798% 0.26888 325.169 / 0.843);
      }
      .sleep-btn:hover {
        box-shadow: 0 12px 12px oklch(71.171% 0.15989 239.246 / 0.843);
      }
      .train-btn:hover {
        box-shadow: 0 12px 12px oklch(65.025% 0.26522 357.482 / 0.731);
      }

      /* Stat bars */
      .stat-bar-container {
        width: 88px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .stat-bar {
        height: 5px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .stat-bar-fill {
        height: 100%;
        border-radius: 3px;
      }
      .hunger-bar .stat-bar-fill {
        background: linear-gradient(90deg, #00cc44, #00ff88);
      }
      .fun-bar .stat-bar-fill {
        background: linear-gradient(90deg, #aa00ff, #ff00cc);
      }
      .sleep-bar .stat-bar-fill {
        background: linear-gradient(90deg, #0044ff, #00aaff);
      }
      .power-bar .stat-bar-fill {
        background: linear-gradient(90deg, #ff4400, #ffcc00);
      }
      .stat-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.5rem;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.05em;
        text-align: center;
      }

      /* Pet chat */
      .infoBox_petChat {
        flex: 1;
        padding: 10px 20px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        text-align: center;
        font-family: "Doto", "Audiowide", monospace;
        font-size: clamp(1rem, 3vw, 1.5rem);
        line-height: 1.4;
        border-radius: 5px;
        border-left: 3px solid oklch(85% 0.25 195 / 0.8);
        background: oklch(12% 0.08 200 / 0.2);
        overflow-wrap: break-word;
        word-break: break-word;
        overflow: hidden;
        background: linear-gradient(
          45deg,
          oklch(73.033% 0.19383 352.633),
          oklch(76.162% 0.1228 258.17),
          oklch(70.428% 0.18362 300.278),
          oklch(89.385% 0.19155 151.458),
          oklch(82.405% 0.12878 64.68),
          oklch(73.033% 0.19383 352.633)
        );
        background-size: 200% 200%;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
        animation: gradientShift 8s ease infinite;
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        #pet-container {
          height: 400px;
        }
        .infoBox {
          flex-direction: column;
        }
        .infoBox-controls {
          width: 100%;
          flex-wrap: wrap;
        }
        .infoBox_petChat {
          border-left: none;
          border-top: 3px solid oklch(85% 0.25 195 / 0.5);
        }
        .Buttons {
          width: 90px;
          height: 36px;
        }
        .stat-bar-container {
          width: 88px;
        }
      }
      @media (max-width: 480px) {
        #pet-container {
          height: 320px;
        }
        .Buttons {
          width: 72px;
          height: 30px;
          font-size: 0.45rem;
          letter-spacing: 2px;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-link" href="/lab">← Lab</a>

    <header class="xeno-header">
      <h1>XENOCHI</h1>
    </header>

    <div class="scaling-root">
      <div id="pet-container">
        <div id="scene-loading">
          <div class="loading-ring"></div>
          <span>Loading model…</span>
        </div>
      </div>

      <div class="infoBox">
        <div class="infoBox-controls">
          <div class="button-container">
            <button class="Buttons feed-btn" id="feed-button">FEED</button>
            <div class="stat-bar-container">
              <div class="stat-bar hunger-bar">
                <div
                  class="stat-bar-fill"
                  id="hungerBar"
                  style="width: 82%"
                ></div>
              </div>
              <span class="stat-label">Hunger: 8</span>
            </div>
          </div>
          <div class="button-container">
            <button class="Buttons dance-btn" id="dance-button">DANCE</button>
            <div class="stat-bar-container">
              <div class="stat-bar fun-bar">
                <div class="stat-bar-fill" id="funBar" style="width: 90%"></div>
              </div>
              <span class="stat-label">Fun: 9</span>
            </div>
          </div>
          <div class="button-container">
            <button class="Buttons sleep-btn" id="sleep-button">SLEEP</button>
            <div class="stat-bar-container">
              <div class="stat-bar sleep-bar">
                <div
                  class="stat-bar-fill"
                  id="sleepBar"
                  style="width: 70%"
                ></div>
              </div>
              <span class="stat-label">Sleep: 7</span>
            </div>
          </div>
          <div class="button-container">
            <button class="Buttons train-btn" id="power-button">TRAIN</button>
            <div class="stat-bar-container">
              <div class="stat-bar power-bar">
                <div
                  class="stat-bar-fill"
                  id="powerBar"
                  style="width: 95%"
                ></div>
              </div>
              <span class="stat-label">Power: 10</span>
            </div>
          </div>
        </div>

        <div class="infoBox_petChat" id="petChat">
          Hello! I am your Xenotchi. Select a stage and press a button!
        </div>
      </div>
    </div>

    <!-- Stage selector — bottom of page -->
    <div class="stage-tabs" role="tablist">
      <button
        class="stage-tab active"
        data-stage="blue"
        role="tab"
        aria-selected="true"
      >
        Blue
      </button>
      <button
        class="stage-tab"
        data-stage="green"
        role="tab"
        aria-selected="false"
      >
        Green
      </button>
    </div>

    <!-- ── Three.js scene ─────────────────────────────────────────────────── -->
    <script type="module">
      import * as THREE from "three";
      import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

      // ─────────────────────────────────────────────────────────────────────
      // Animation config — values taken directly from Transcendence animationConfig.js
      // ─────────────────────────────────────────────────────────────────────
      const MODEL_BASE = "/models/xenotchi";

      const animConfig = {
        blue: {
          idle: {
            file: "blue_happy_idle.fbx",
            scale: [0.00163, 0.00163, 0.00163],
            position: [0, 0.2, -3],
            rotationY: -Math.PI / -16,
          },
          feed: {
            file: "FEED.fbx",
            scale: [0.0008, 0.0008, 0.0008],
            position: [1, 0.1, -1],
            rotationY: -Math.PI / 1,
          },
          dance: {
            file: "blue_robot.fbx",
            scale: [0.00247, 0.00247, 0.00247],
            position: [0, -3, -6.5],
            rotationY: Math.PI / 9,
          },
          sleep: {
            file: "SLEEP.fbx",
            scale: [0.0018, 0.0018, 0.0018],
            position: [-7.8, -2.8, -4.9],
            rotationY: Math.PI / 5,
          },
          train: {
            file: "cat_punch_kick.fbx",
            scale: [0.00189, 0.00189, 0.00189],
            position: [0, -1.9, -4],
            rotationY: Math.PI / 9,
          },
        },
        green: {
          idle: {
            file: "green_drunk.fbx",
            scale: [0.00186, 0.00186, 0.00186],
            position: [0, -1.5, -3],
            rotationY: -Math.PI / -16,
          },
          feed: {
            file: "green_eat.fbx",
            scale: [0.00427, 0.00427, 0.00427],
            position: [-5.5, -4.5, -14],
            rotationY: -Math.PI / 1.2,
          },
          dance: {
            file: "green_thrille4.fbx",
            scale: [0.00463, 0.00463, 0.00463],
            position: [7, -6, -20.9],
            rotationY: Math.PI / -6,
          },
          sleep: {
            file: "green_sleep.fbx",
            scale: [0.00539, 0.00539, 0.00539],
            position: [-18.3, -3.5, -15.9],
            rotationY: Math.PI / 5,
          },
          train: {
            file: "green_butterfly.fbx",
            scale: [0.0039, 0.0039, 0.0039],
            position: [-3.5, -5.2, -18],
            rotationY: Math.PI / 12,
          },
        },
      };

      const chatLines = {
        feed: "🍽️ This is so good, it's actually making me angry. How dare you set the bar this high? Hit the spot!",
        dance: " I gets BUZY! Pawz on fire!",
        sleep: "😴 Got tickets to the blanket show...zzz",
        train:
          "🐉 The purpose of today's training is to defeat yesterday's understanding.",
        idleBlue: "Ready to go! What do you want to do?",
        idleGreen: "Evolved and ready! What's the move? 💚",
      };

      // ─────────────────────────────────────────────────────────────────────
      // Scene state
      // ─────────────────────────────────────────────────────────────────────
      let scene, camera, renderer, petRoot, mixer, clock;
      let activeModel = null;
      let lastBaseScale = [0.001, 0.001, 0.001];
      let loadToken = 0;
      let currentStage = "blue";
      let busy = false;

      const container = document.getElementById("pet-container");
      const loadingEl = document.getElementById("scene-loading");
      const chatEl = document.getElementById("petChat");

      // ─────────────────────────────────────────────────────────────────────
      // Init
      // ─────────────────────────────────────────────────────────────────────
      function init() {
        clock = new THREE.Clock();

        scene = new THREE.Scene();
        // Transparent canvas — CSS background-image on #pet-container shows through
        scene.background = null;

        petRoot = new THREE.Group();
        scene.add(petRoot);

        // Lights — exact values from Transcendence animRender.js initRenderer()
        scene.add(new THREE.AmbientLight(0x0000ff, 1.4));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.castShadow = true;
        dirLight.position.set(-2, 10, 6.5);
        scene.add(dirLight);

        const pinkLight = new THREE.DirectionalLight(0xff00ff, 1.5);
        pinkLight.position.set(2, 4, 2);
        scene.add(pinkLight);

        const topLight = new THREE.DirectionalLight(0xff0099, 0.8);
        topLight.position.set(0, 5, 0);
        topLight.castShadow = true;
        scene.add(topLight);

        const sideLight = new THREE.DirectionalLight(0x0000ff, 0.5);
        sideLight.position.set(-5, 2, 0);
        sideLight.castShadow = true;
        scene.add(sideLight);

        const backLight = new THREE.DirectionalLight(0x00ffff, 0.3);
        backLight.position.set(0, 2, -5);
        backLight.castShadow = true;
        scene.add(backLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(10, 10),
          new THREE.ShadowMaterial({ opacity: 0.3 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.7;
        ground.receiveShadow = true;
        scene.add(ground);

        // Camera — from initRenderer()
        camera = new THREE.PerspectiveCamera(
          75,
          container.offsetWidth / container.offsetHeight,
          0.1,
          1000,
        );
        camera.position.set(0, 1.5, 3);

        // Renderer — alpha:true so CSS background shows through
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearAlpha(0);
        container.appendChild(renderer.domElement);

        resizeRendererToContainer();
        window.addEventListener("resize", resizeRendererToContainer);

        animate();
        loadAnim("idle");
      }

      // Match Transcendence resizeRendererToContainer — uses offsetWidth/offsetHeight
      function resizeRendererToContainer() {
        const width = Math.floor(container.offsetWidth);
        const height = Math.floor(container.offsetHeight);
        // setSize with updateStyle=true so canvas CSS fills the container
        renderer.setSize(width, height, true);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        fitModelForViewport(activeModel);
      }

      // Match Transcendence fitModelForViewport
      function fitModelForViewport(model) {
        if (!model) return;
        const isMobile = window.matchMedia("(max-width: 768px)").matches;
        if (!isMobile) {
          model.scale.set(lastBaseScale[0], lastBaseScale[1], lastBaseScale[2]);
          return;
        }
        const w = container ? container.clientWidth : window.innerWidth;
        const t = Math.max(360, Math.min(900, w));
        const k = 1.21 - ((t - 360) / (900 - 360)) * 0.21;
        model.scale.set(
          lastBaseScale[0] * k,
          lastBaseScale[1] * k,
          lastBaseScale[2] * k,
        );
      }

      // ─────────────────────────────────────────────────────────────────────
      // Animation loop
      // ─────────────────────────────────────────────────────────────────────
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
        renderer.render(scene, camera);
      }

      // ─────────────────────────────────────────────────────────────────────
      // Model loading — mirrors Transcendence loadAndDisplayFBX
      // ─────────────────────────────────────────────────────────────────────
      function clearModel() {
        if (!activeModel) return;
        petRoot.remove(activeModel);
        activeModel.traverse((child) => {
          if (child.isMesh) {
            child.geometry?.dispose();
            if (Array.isArray(child.material)) {
              child.material.forEach((m) => m.dispose());
            } else {
              child.material?.dispose();
            }
          }
        });
        activeModel = null;
        mixer = null;
      }

      async function loadAnim(action, loop = true) {
        const cfg = animConfig[currentStage][action];
        if (!cfg) return 0;

        const myToken = ++loadToken;

        const loaderTimer = setTimeout(() => {
          if (loadToken === myToken) {
            loadingEl.classList.remove("hidden");
            loadingEl.querySelector("span").textContent = "Loading model…";
          }
        }, 300);

        try {
          const fbx = await new Promise((res, rej) => {
            new FBXLoader().load(
              `${MODEL_BASE}/${cfg.file}`,
              res,
              undefined,
              rej,
            );
          });

          if (loadToken !== myToken) return 0; // superseded by newer request

          clearTimeout(loaderTimer);
          loadingEl.classList.add("hidden");
          clearModel();

          const [sx, sy, sz] = cfg.scale;
          const [px = 0, py = -1, pz = 0] = cfg.position;

          fbx.scale.set(sx, sy, sz);
          fbx.position.set(px, py, pz);
          fbx.rotation.y = cfg.rotationY ?? 0;

          fbx.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          petRoot.add(fbx);
          activeModel = fbx;
          lastBaseScale = [sx, sy, sz];

          fitModelForViewport(activeModel);

          mixer = new THREE.AnimationMixer(fbx);
          const clip = fbx.animations?.[0];
          if (clip) {
            const act = mixer.clipAction(clip);
            act.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce);
            if (!loop) act.clampWhenFinished = true;
            act.play();
          }

          return clip ? clip.duration * 1000 : 2500;
        } catch (err) {
          clearTimeout(loaderTimer);
          loadingEl.classList.remove("hidden");
          loadingEl.querySelector("span").textContent = "Model unavailable";
          console.error("FBX load error:", err);
          return 0;
        }
      }

      // ─────────────────────────────────────────────────────────────────────
      // Action handler
      // ─────────────────────────────────────────────────────────────────────
      async function doAction(action) {
        if (busy) return;
        busy = true;
        setButtonsDisabled(true);
        chatEl.textContent = chatLines[action] ?? "…";

        const duration = await loadAnim(action, false);
        if (duration > 0) await delay(Math.min(duration, 7000));

        const idleKey = currentStage === "blue" ? "idleBlue" : "idleGreen";
        chatEl.textContent = chatLines[idleKey];
        await loadAnim("idle", true);

        busy = false;
        setButtonsDisabled(false);
      }

      function setButtonsDisabled(val) {
        document
          .querySelectorAll(".Buttons")
          .forEach((b) => (b.disabled = val));
      }
      function delay(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      // ─────────────────────────────────────────────────────────────────────
      // Stage switching
      // ─────────────────────────────────────────────────────────────────────
      document.querySelectorAll(".stage-tab").forEach((tab) => {
        tab.addEventListener("click", async () => {
          if (busy) return;
          const stage = tab.dataset.stage;
          if (stage === currentStage) return;

          currentStage = stage;
          document.querySelectorAll(".stage-tab").forEach((t) => {
            t.classList.toggle("active", t.dataset.stage === stage);
            t.setAttribute("aria-selected", t.dataset.stage === stage);
          });

          const idleKey = stage === "blue" ? "idleBlue" : "idleGreen";
          chatEl.textContent = chatLines[idleKey];
          await loadAnim("idle", true);
        });
      });

      // ─────────────────────────────────────────────────────────────────────
      // Button wiring
      // ─────────────────────────────────────────────────────────────────────
      document
        .getElementById("feed-button")
        .addEventListener("click", () => doAction("feed"));
      document
        .getElementById("dance-button")
        .addEventListener("click", () => doAction("dance"));
      document
        .getElementById("sleep-button")
        .addEventListener("click", () => doAction("sleep"));
      document
        .getElementById("power-button")
        .addEventListener("click", () => doAction("train"));

      init();
    </script>
  </body>
</html>
