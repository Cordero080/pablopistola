<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sine Wave — Lab Demo | Pablo Cordero</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas#waves {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      .back-link {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(0, 255, 247, 0.65);
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid rgba(0, 255, 247, 0.2);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        transition:
          color 0.2s,
          border-color 0.2s;
      }

      .back-link:hover {
        color: #00fff7;
        border-color: rgba(0, 255, 247, 0.5);
      }

      .hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.2);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="/lab">← Lab</a>
    <canvas id="waves"></canvas>
    <p class="hint">Move cursor · Spacebar toggles direction</p>

    <script src="/src/js/effects/sineWave.js" defer></script>
  </body>
</html>
