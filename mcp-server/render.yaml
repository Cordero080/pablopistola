services:
  - type: web
    name: pablo-portfolio-mcp
    runtime: python
    rootDir: mcp-server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render will prompt you to enter this manually (keeps it secret)
      - key: PYTHON_VERSION
        value: "3.11"
