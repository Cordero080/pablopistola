<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-ZL1CZZKRKD"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZL1CZZKRKD");
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Art Gallery - Coming Soon | Pablo Pistola</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/typography.css" />
    <link rel="stylesheet" href="styles/art.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Sine Wave Canvas -->
    <canvas id="waves"></canvas>

    <!-- Parallax Background -->
    <div class="parallax-bg-overlay" aria-hidden="true">
      <div class="parallax-ellipse"></div>
    </div>

    <main id="main-content" class="coming-soon-container" role="main">
      <span class="coming-soon-badge" aria-label="Status: Coming Soon"
        >Coming Soon</span
      >

      <h1 class="coming-soon-title">Art Gallery</h1>

      <p class="coming-soon-subtitle">At some point...</p>

      <div class="art-preview-grid" aria-hidden="true">
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
      </div>

      <a href="/home" class="back-link" aria-label="Go back to home page">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Home
      </a>
    </main>

    <script src="js/sineWave.js"></script>
    <script src="app.js" defer></script>
    <script>
      // Initialize sine wave background
      document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("waves");
        if (canvas && typeof SineWave !== "undefined") {
          new SineWave(canvas, {
            speed: 0.008,
            amplitude: 40,
            wavelength: 0.015,
            strokeStyle: "rgba(0, 255, 247, 0.08)",
          });
        }
      });
    </script>
  </body>
</html>
