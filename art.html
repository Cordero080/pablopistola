    <title>Art Gallery - Coming Soon | Pablo Pistola</title>
    <link rel="stylesheet" href="Css/style.css" />
    <style>
      /* Coming Soon Page Styles */
      .coming-soon-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 2rem;
        text-align: center;
      }

      .coming-soon-badge {
        font-family: "strelka", sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #00fff7;
        background: rgba(0, 255, 247, 0.1);
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid rgba(0, 255, 247, 0.3);
        margin-bottom: 2rem;
        animation: badgePulse 2s ease-in-out infinite;
      }

      @keyframes badgePulse {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(0, 255, 247, 0.2);
        }
        50% {
          box-shadow: 0 0 25px rgba(0, 255, 247, 0.4);
        }
      }

      .coming-soon-title {
        font-family: "thornwood-vf", sans-serif;
        font-variation-settings:
          "wght" 200,
          "wdth" 50;
        font-size: clamp(3rem, 10vw, 7rem);
        background: linear-gradient(90deg, #ff006e, #8338ec, #00fff7, #ff006e);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: titleGradient 6s linear infinite;
        margin-bottom: 1rem;
        line-height: 1.1;
      }

      @keyframes titleGradient {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 300% 50%;
        }
      }

      .coming-soon-subtitle {
        font-family: "Inter", sans-serif;
        font-size: clamp(1rem, 2.5vw, 1.3rem);
        color: rgba(255, 255, 255, 0.6);
        max-width: 500px;
        line-height: 1.7;
        margin-bottom: 3rem;
      }

      /* Animated art preview placeholders */
      .art-preview-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        max-width: 400px;
        margin-bottom: 3rem;
      }

      .art-placeholder {
        aspect-ratio: 1;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 247, 0.1),
          rgba(255, 0, 204, 0.1)
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        position: relative;
        overflow: hidden;
      }

      .art-placeholder::before {
        content: "";
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.05) 50%,
          transparent 70%
        );
        animation: shimmer 3s ease-in-out infinite;
      }

      .art-placeholder:nth-child(2)::before {
        animation-delay: 0.3s;
      }
      .art-placeholder:nth-child(3)::before {
        animation-delay: 0.6s;
      }
      .art-placeholder:nth-child(4)::before {
        animation-delay: 0.9s;
      }
      .art-placeholder:nth-child(5)::before {
        animation-delay: 1.2s;
      }
      .art-placeholder:nth-child(6)::before {
        animation-delay: 1.5s;
      }

      @keyframes shimmer {
        0% {
          transform: translate(-50%, -50%) rotate(45deg);
        }
        100% {
          transform: translate(50%, 50%) rotate(45deg);
        }
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        transition: color 0.3s ease;
        padding: 12px 24px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 30px;
      }

      .back-link:hover {
        color: #00fff7;
        border-color: rgba(0, 255, 247, 0.4);
      }

      .back-link svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s ease;
      }

      .back-link:hover svg {
        transform: translateX(-4px);
      }

      /* Accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #00fff7;
        color: #000;
        padding: 8px 16px;
        z-index: 1000;
        text-decoration: none;
        font-family: "Inter", sans-serif;
      }

      .skip-link:focus {
        top: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .coming-soon-badge,
        .coming-soon-title,
        .art-placeholder::before {
          animation: none;
        }
      }

      @media (max-width: 480px) {
        .art-preview-grid {
          grid-template-columns: repeat(2, 1fr);
          max-width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Parallax Background -->
    <div class="parallax-bg-overlay" aria-hidden="true">
      <div class="parallax-ellipse"></div>
    </div>

    <main id="main-content" class="coming-soon-container" role="main">
      <span class="coming-soon-badge" aria-label="Status: Coming Soon"
        >Coming Soon</span
      >

      <h1 class="coming-soon-title">Art Gallery</h1>

      <p class="coming-soon-subtitle">
        A curated collection of digital art, illustrations, and creative
        experiments. Currently being assembled from the creative vault.
      </p>

      <div class="art-preview-grid" aria-hidden="true">
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
        <div class="art-placeholder"></div>
      </div>

      <a href="home.html" class="back-link" aria-label="Go back to home page">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Home
      </a>
    </main>

    <script src="js/sineWave.js"></script>
  </body>
</html>
