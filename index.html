<!-- Minimal Parallax Background Overlay -->
<div class="parallax-bg-overlay">
  <svg
    class="parallax-geo"
    viewBox="0 0 1440 320"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M0,240 Q360,120 720,200 T1440,160 L1440,320 L0,320 Z"
      fill="url(#parallaxGradient)"
      opacity="0.13"
    />
    <defs>
      <linearGradient
        id="parallaxGradient"
        x1="0"
        y1="0"
        x2="1440"
        y2="320"
        gradientUnits="userSpaceOnUse"
      >
        <stop stop-color="#00fff7" />
        <stop offset="0.5" stop-color="#ff00cc" />
        <stop offset="1" stop-color="#8338ec" />
      </linearGradient>
    </defs>
  </svg>
</div>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Floating Cards with Parallax</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/feathers.css" />
    <link rel="stylesheet" href="Css/compMode.css" />
    <script src="js/sineWave.js" defer></script>
    <script src="js/feathers.js" defer></script>
    <script src="app.js" defer></script>
    <script src="js/orb.js" defer></script>
    <script src="js/compMode.js" defer></script>
  </head>
  <body>
    <audio
      id="site-audio"
      src="./music/Sonata Saeculorum.mp3"
      autoplay
      loop
    ></audio>
    <!-- Minimal Parallax Background Overlay: obtuse triangle -->
    <div class="parallax-bg-overlay">
      <div class="parallax-ellipse"></div>
    </div>
    <div class="quantum-ripple" id="quantumRipple"></div>

    <nav class="quantum-nav">
      <div class="nav-logo">
        <span class="logo-text" id="myName" data-text="PABLOPISTOLA"
          >PABLOPISTOLA</span
        >
        <div class="logo-particles"></div>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="#contact">Contact</a>
      </div>

      <div class="nav-quantum-field"></div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-bg-glow"></div>
      <div class="hero-content">
        <h1 class="hero-title">
          PABLO <span class="hero-title-alt">PISTOLA</span>
        </h1>
        <span class="hero-underline"></span>
        <p class="hero-tagline">
          Futuristic Creations. Quantum Code. Digital Artistry.
        </p>
        <a href="#projects" class="hero-cta">View Projects</a>
      </div>
    </section>
    <!-- End Hero Section -->

    <canvas id="waves"></canvas>
    <div class="container">
      <div class="card" data-speed="0.3">
        <h2 class="glitch" data-text="PROJECT I">PROJECT I</h2>
        <p class="card-description">TRANSCENDNCE PET SIM</p>
      </div>
      <div class="card" data-speed="-0.4">
        <h2 class="glitch" data-text="PROJECT II">PROJECT II</h2>
        <p class="card-description">DOJO APP</p>
      </div>
      <div class="card" data-speed="0.9">
        <h2 class="glitch" data-text="PROJECT III">PROJECT III</h2>
        <p class="card-description">MAGNUM OPUS</p>
      </div>
      <div id="moreCardContainer"></div>
    </div>
  </body>
</html>
