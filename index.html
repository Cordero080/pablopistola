  <body>
    <canvas id="waves"></canvas>

    <div class="spacebar-prompt" id="spacebarPrompt">press spacebar</div>

    <div class="landing-container"></div>

    <!-- Curtain reveal overlay -->
    <div class="curtain-overlay" id="curtainOverlay"></div>

    <div class="enter-identity" aria-hidden="true">
      <h1 class="enter-identity-title">PVBLO CORDERO</h1>
      <p class="enter-identity-subtitle">FULL-STACK ENGINEER · AI SYSTEMS</p>
    </div>

    <a href="/home.html" class="enter-btn" id="enterBtn"><span>enter</span></a>

    <script src="src/js/sineWave.js"></script>
    <script>
      // Check for ?stay param - if present, stay on landing (zen mode)
      const urlParams = new URLSearchParams(window.location.search);
      const stayMode = urlParams.has("stay");

      // If user previously skipped and this isn't zen mode, go straight to home
      if (!stayMode && sessionStorage.getItem("skippedLanding")) {
        window.location.replace("/home.html");
      }

      // Zen mode: reposition button and change text
      if (stayMode) {
        document.body.classList.add("zen-mode");
        document.querySelector("#enterBtn span").textContent = "back";
      }

      // Show enter button after 1.5s
      setTimeout(() => {
        document.getElementById("enterBtn").classList.add("visible");
      }, 1500);

      // Handle enter click - remember preference
      document.getElementById("enterBtn").addEventListener("click", (e) => {
        e.preventDefault();
        sessionStorage.setItem("skippedLanding", "true");
        window.location.href = "/home.html";
      });

      if (!stayMode) {
        // Auto-transition after 5 seconds with scanline dissolve
        setTimeout(() => {
          // Hide enter button during transition
          document.getElementById("enterBtn").classList.remove("visible");

          // Add dissolving class to all elements
          document
            .querySelector(".landing-container")
            .classList.add("dissolving");
          document.getElementById("waves").classList.add("dissolving");
          document
            .querySelector(".spacebar-prompt")
            ?.classList.add("dissolving");
          document
            .querySelector(".enter-identity")
            ?.classList.add("dissolving");

          // Navigate after dissolve animation completes
          setTimeout(() => {
            window.location.href = "/home.html";
          }, 2500);
        }, 5000);
      }
    </script>
  </body>
