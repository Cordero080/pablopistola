<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-ZL1CZZKRKD"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZL1CZZKRKD");
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pablo Cordero | Enter</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#00fff7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucент"
    />
    <meta name="apple-mobile-web-app-title" content="Pablo Cordero" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Orbitron:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/landing.css" />
    <!-- Vercel Analytics (only loads on Vercel) -->
    <script>
      if (
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = "/_vercel/insights/script.js";
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <canvas id="waves"></canvas>

    <div class="spacebar-prompt" id="spacebarPrompt">press spacebar</div>

    <div class="landing-container"></div>

    <!-- Curtain reveal overlay -->
    <div class="curtain-overlay" id="curtainOverlay"></div>

    <a href="/home.html" class="skip-link" id="skipLink">skip →</a>

    <div class="interaction-hint" id="interactionHint">
      <span class="hint-icon">〰</span>
      <span class="hint-text desktop-hint"
        >Move your mouse to play with the waves</span
      >
      <span class="hint-text mobile-hint"
        >Touch to interact with the waves</span
      >
    </div>

    <script src="js/sineWave.js"></script>
    <script src="js/landing.js"></script>
    <script>
      // Show skip link after 1.5s
      setTimeout(() => {
        document.getElementById('skipLink').classList.add('visible');
      }, 1500);

      // Check for ?stay param - if present, stay on landing (zen mode)
      const urlParams = new URLSearchParams(window.location.search);
      const stayMode = urlParams.has('stay');

      if (!stayMode) {
        // Auto-transition after 5 seconds with scanline dissolve
        setTimeout(() => {
          // Hide skip link during transition
          document.getElementById('skipLink').classList.remove('visible');
          
          // Add dissolving class to all elements
          document
            .querySelector(".landing-container")
            .classList.add("dissolving");
          document.querySelector(".interaction-hint").classList.add("dissolving");
          document.getElementById("waves").classList.add("dissolving");
          document.querySelector(".spacebar-prompt")?.classList.add("dissolving");

          // Navigate after dissolve animation completes
          setTimeout(() => {
            window.location.href = "/home.html";
          }, 2500);
        }, 5000);
      }
    </script>
  </body>
</html>
