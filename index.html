<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Floating Cards with Parallax</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/feathers.css" />
    <link rel="stylesheet" href="Css/compMode.css" />
    <script src="js/sineWave.js" defer></script>
    <script src="js/feathers.js" defer></script>
    <script src="app.js" defer></script>
    <script src="js/orb.js" defer></script>
    <script src="js/compMode.js" defer></script>
  </head>
  <body>
    <audio
      id="site-audio"
      src="./music/Sonata Saeculorum.mp3"
      autoplay
      loop
    ></audio>
    <div class="quantum-ripple" id="quantumRipple"></div>

    <nav class="quantum-nav">
      <div class="nav-logo">
        <span class="logo-text" id="myName" data-text="PABLOPISTOLA"
          >PABLOPISTOLA</span
        >
        <div class="logo-particles"></div>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="#contact">Contact</a>
      </div>
     
      <div class="nav-quantum-field"></div>
    </nav>

    <canvas id="waves"></canvas>
    <div class="container">
      <div class="card" data-speed="0.3">
        <h2 class="glitch" data-text="PROJECT I">PROJECT I</h2>
        <p class="card-description">TRANSCENDNCE PET SIM</p>
      </div>
      <div class="card" data-speed="-0.4">
        <h2 class="glitch" data-text="PROJECT II">PROJECT II</h2>
        <p class="card-description">DOJO APP</p>
      </div>
      <div class="card" data-speed="0.9">
        <h2 class="glitch" data-text="PROJECT III">PROJECT III</h2>
        <p class="card-description">MAGNUM OPUS</p>
      </div>
      <div id="moreCardContainer"></div>
    </div>
  </body>
</html>
